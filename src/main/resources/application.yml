server:
  port: 8080

spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 55MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskpulse}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:655650}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  thymeleaf:
    prefix: file:./templates/
    suffix: .html
    mode: HTML
    cache: false
  web:
    resources:
      static-locations: file:./static/
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    org.hibernate.SQL: info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:taskpulse-dev-secret-key-taskpulse-dev-secret-key}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:10080}
    remember-expiration-minutes: ${JWT_REMEMBER_EXPIRATION_MINUTES:43200}
